<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Gamer - Painel do Robô de Hardware</title>
<style>
:root {
    --bg-0: #07070d; --bg-1: #0f1119; --bg-2: #161927; --bg-3: #1e2233;
    --border: rgba(255,255,255,0.08);
    --accent: #8b5cf6; --accent-2: #22d3ee;
    --accent-grad: linear-gradient(135deg, #8b5cf6 0%, #22d3ee 100%);
    --danger: #ff5470; --success: #34e2a4;
    --text-0: #f5f6fb; --text-1: #a9adc1; --text-2: #6d7286;
    --radius-sm: 8px; --radius: 14px; --radius-lg: 22px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: radial-gradient(circle at 15% 0%, #171233 0%, var(--bg-0) 45%) fixed;
    color: var(--text-0);
    min-height: 100vh;
    padding-bottom: 60px;
}
a { color: var(--accent-2); }
header {
    padding: 22px 28px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px;
    background: rgba(10,11,20,0.85); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 10;
}
header h1 { font-size: 18px; letter-spacing: 1px; }
header h1 span {
    background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.status-pill { display:flex; align-items:center; gap:8px; font-size:13px; color: var(--text-1); }
.ponto { width:8px; height:8px; border-radius:50%; background: var(--text-2); }
.ponto.ok { background: var(--success); }
.ponto.erro { background: var(--danger); }

.config-api { display:flex; gap:8px; align-items:center; }
.config-api input {
    padding: 8px 12px; border-radius: 999px; border:1px solid var(--border);
    background: var(--bg-2); color: var(--text-0); font-size: 13px; width: 260px;
}
.config-api button {
    padding: 8px 16px; border-radius: 999px; border:1px solid var(--border);
    background: var(--bg-2); color: var(--text-0); cursor:pointer; font-size: 13px;
}
.config-api button:hover { border-color: var(--accent); }

main { max-width: 1180px; margin: 0 auto; padding: 30px 24px; display: grid; gap: 24px; grid-template-columns: 1.1fr 1.4fr; align-items: start; }
@media (max-width: 980px) { main { grid-template-columns: 1fr; } }

.panel { background: var(--bg-1); border:1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; }
.panel h2 { font-size: 17px; margin-bottom: 4px; }
.panel .sub { color: var(--text-2); font-size: 13px; margin-bottom: 18px; }

.field { margin-bottom: 14px; }
.field label { display:block; font-size: 12.5px; font-weight:600; color: var(--text-1); margin-bottom: 6px; }
.field input, .field select {
    width:100%; padding: 11px 13px; border-radius: var(--radius-sm); border:1px solid var(--border);
    background: var(--bg-2); color: var(--text-0); font-size: 14px;
}
.field-row { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.btn {
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding: 12px 20px; border-radius: var(--radius-sm); border:none; font-weight:700; font-size:14px;
    cursor:pointer; width:100%; background: var(--accent-grad); color:#0a0a14; transition:.2s;
}
.btn:hover { filter: brightness(1.1); }
.btn:disabled { opacity:.6; cursor:not-allowed; }

.msg { font-size: 13.5px; padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 14px; display:none; }
.msg.erro { display:block; background: rgba(255,84,112,0.12); color: var(--danger); border:1px solid rgba(255,84,112,.35); }
.msg.ok { display:block; background: rgba(52,226,164,.12); color: var(--success); border:1px solid rgba(52,226,164,.35); }

.resultado { display:none; margin-top: 18px; padding-top: 18px; border-top:1px solid var(--border); }
.resultado.ativo { display:block; }
.veredito { font-weight:800; font-size: 15px; padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 16px; text-align:center; }
.veredito.INSUFICIENTE, .veredito.MÍNIMO { background: rgba(255,84,112,.12); color: var(--danger); }
.veredito.RECOMENDADO { background: rgba(139,92,246,.15); color: #c9b6ff; }
.veredito.ÓTIMO { background: rgba(52,226,164,.12); color: var(--success); }

.linha { margin-bottom: 14px; }
.linha-topo { display:flex; justify-content:space-between; font-size:13px; color: var(--text-1); margin-bottom:6px; }
.barra { height:6px; background: var(--bg-3); border-radius:4px; overflow:hidden; }
.barra-fill { height:100%; background: var(--accent-grad); border-radius:4px; }
.linha small { display:block; font-size:11.5px; color: var(--text-2); margin-top:4px; }

.tabela-scroll { max-height: 340px; overflow-y:auto; margin-top: 10px; }
table { width:100%; border-collapse: collapse; font-size: 13px; }
th { text-align:left; padding: 8px 10px; color: var(--text-2); font-size:11px; text-transform:uppercase; position:sticky; top:0; background: var(--bg-1); }
td { padding: 9px 10px; border-top: 1px solid var(--border); }

.abas { display:flex; gap:6px; margin-bottom: 14px; }
.abas button {
    background:none; border:1px solid var(--border); color: var(--text-1); padding: 7px 14px;
    border-radius: 999px; font-size: 12.5px; cursor:pointer;
}
.abas button.ativo { background: var(--accent-grad); color:#0a0a14; border-color:transparent; font-weight:700; }
</style>
</head>
<body>

<header>
    <h1>GHOST GAMER <span>/ Painel do Robô</span></h1>
    <div class="status-pill"><span class="ponto" id="pontoStatus"></span> <span id="textoStatus">Verificando conexão...</span></div>
    <div class="config-api">
        <input type="text" id="apiUrl" placeholder="http://localhost:8000">
        <button id="btnSalvarApi">Conectar</button>
    </div>
</header>

<main>
    <section class="panel">
        <h2>Verificar compatibilidade</h2>
        <p class="sub">Consulta o motor oficial de comparação (banco de hardware + histórico).</p>

        <div id="msgComparar" class="msg"></div>

        <form id="formComparar">
            <div class="field">
                <label>Aplicativo / Jogo</label>
                <select id="appNome" required></select>
            </div>

            <div class="field-row">
                <div class="field"><label>Modelo da CPU</label><input type="text" id="cpuModelo" placeholder="Core i7-12700K" required></div>
                <div class="field"><label>Modelo da GPU</label><input type="text" id="gpuModelo" placeholder="RTX 3070"></div>
            </div>
            <div class="field-row">
                <div class="field"><label>Núcleos</label><input type="number" id="cpuNucleos" min="1" required></div>
                <div class="field"><label>Threads</label><input type="number" id="cpuThreads" min="1" required></div>
            </div>
            <div class="field-row">
                <div class="field"><label>Clock (GHz)</label><input type="number" step="0.1" id="cpuClock" min="0" required></div>
                <div class="field"><label>VRAM (GB)</label><input type="number" id="gpuVram" min="0" value="0"></div>
            </div>
            <div class="field-row">
                <div class="field"><label>RAM total (GB)</label><input type="number" id="ramTotal" min="1" required></div>
                <div class="field"><label>Armazenamento livre (GB)</label><input type="number" id="storageLivre" min="0" required></div>
            </div>
            <div class="field">
                <label>Sistema operacional</label>
                <input type="text" id="soNome" value="Windows 11" required>
            </div>

            <button type="submit" class="btn" id="btnComparar">Verificar compatibilidade</button>
        </form>

        <div id="resultado" class="resultado"></div>
    </section>

    <section class="panel">
        <div class="abas">
            <button data-aba="apps" class="ativo">Aplicativos</button>
            <button data-aba="cpus">CPUs</button>
            <button data-aba="gpus">GPUs</button>
        </div>
        <p class="sub" id="cargaInfo">Carregando catálogo...</p>
        <div class="tabela-scroll"><table id="tabelaCatalogo"></table></div>
    </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let apiUrl = localStorage.getItem("hardware_api_url") || "http://localhost:8000";
$("apiUrl").value = apiUrl;

async function chamarApi(caminho, opcoes = {}) {
    const resposta = await fetch(apiUrl.replace(/\/$/, "") + caminho, {
        headers: { "Content-Type": "application/json" },
        ...opcoes,
    });
    const dados = await resposta.json().catch(() => null);
    if (!resposta.ok) {
        const detalhe = dados && (dados.detail || dados.mensagem);
        throw new Error(typeof detalhe === "string" ? detalhe : "Erro ao consultar a API (" + resposta.status + ")");
    }
    return dados;
}

async function verificarStatus() {
    const ponto = $("pontoStatus"), texto = $("textoStatus");
    try {
        const saude = await chamarApi("/health");
        ponto.className = "ponto " + (saude.status === "ok" ? "ok" : "erro");
        texto.textContent = saude.status === "ok" ? "Robô conectado e saudável" : "Robô respondeu, mas com erro";
    } catch (e) {
        ponto.className = "ponto erro";
        texto.textContent = "Não foi possível conectar em " + apiUrl;
    }
}

$("btnSalvarApi").addEventListener("click", () => {
    apiUrl = $("apiUrl").value.trim() || apiUrl;
    localStorage.setItem("hardware_api_url", apiUrl);
    verificarStatus();
    carregarApps();
    carregarTabela("apps");
});

// ---------- Carrega lista de apps para o select ----------
async function carregarApps() {
    try {
        const resposta = await chamarApi("/apps");
        const select = $("appNome");
        select.innerHTML = resposta.apps.map(a => `<option value="${a.nome}">${a.nome}</option>`).join("");
        if (appPreSelecionado && resposta.apps.some(a => a.nome === appPreSelecionado)) {
            select.value = appPreSelecionado;
        }
    } catch (e) { /* status pill já mostra o erro de conexão */ }
}

// ---------- Abas de catálogo (apps / cpus / gpus) ----------
let abaAtual = "apps";
document.querySelectorAll(".abas button").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll(".abas button").forEach(b => b.classList.remove("ativo"));
        btn.classList.add("ativo");
        abaAtual = btn.dataset.aba;
        carregarTabela(abaAtual);
    });
});

async function carregarTabela(aba) {
    const info = $("cargaInfo");
    const tabela = $("tabelaCatalogo");
    info.textContent = "Carregando...";
    tabela.innerHTML = "";

    try {
        const resposta = await chamarApi("/" + aba + "?limit=200");
        const dados = resposta[aba]; // a API sempre devolve {"apps": [...]}, {"cpus": [...]} ou {"gpus": [...]}
        info.textContent = dados.length + " registro(s)";

        if (aba === "apps") {
            tabela.innerHTML = "<tr><th>Nome</th><th>Categoria</th><th>Versão</th><th>Desenvolvedor</th></tr>" +
                dados.map(a => `<tr><td>${a.nome}</td><td>${a.categoria ?? "-"}</td><td>${a.versao ?? "-"}</td><td>${a.desenvolvedor ?? "-"}</td></tr>`).join("");
        } else if (aba === "cpus") {
            tabela.innerHTML = "<tr><th>Modelo</th><th>Núcleos</th><th>Clock boost</th><th>Ano</th></tr>" +
                dados.map(c => `<tr><td>${c.fabricante} ${c.modelo}</td><td>${c.nucleos_total ?? "-"}</td><td>${c.clock_boost_ghz ?? "-"} GHz</td><td>${c.ano_lancamento ?? "-"}</td></tr>`).join("");
        } else {
            tabela.innerHTML = "<tr><th>Modelo</th><th>VRAM</th><th>Fabricante</th><th>Ano</th></tr>" +
                dados.map(g => `<tr><td>${g.modelo}</td><td>${g.vram_gb ?? "-"} GB</td><td>${g.fabricante ?? "-"}</td><td>${g.ano_lancamento ?? "-"}</td></tr>`).join("");
        }
    } catch (e) {
        info.textContent = "Não foi possível carregar (verifique a conexão com a API).";
    }
}

// ---------- Formulário de comparação ----------
function linhaComponente(c) {
    const nivel = (c.status || "").toUpperCase();
    return `
        <div class="linha">
            <div class="linha-topo"><span>${c.componente}</span><span>${c.score}/100</span></div>
            <div class="barra"><div class="barra-fill" style="width:${c.score}%"></div></div>
            <small>${c.observacao || ""}</small>
        </div>
    `;
}

$("formComparar").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("msgComparar");
    const btn = $("btnComparar");
    const resultado = $("resultado");

    msg.className = "msg";
    resultado.classList.remove("ativo");
    btn.disabled = true;
    btn.textContent = "Verificando...";

    const payload = {
        app_nome: $("appNome").value,
        salvar: true,
        specs: {
            so: $("soNome").value,
            so_versao: "",
            cpu_modelo: $("cpuModelo").value,
            cpu_nucleos: Number($("cpuNucleos").value),
            cpu_threads: Number($("cpuThreads").value),
            cpu_clock_ghz: Number($("cpuClock").value),
            gpu_modelo: $("gpuModelo").value,
            gpu_vram_gb: Number($("gpuVram").value || 0),
            ram_total_gb: Number($("ramTotal").value),
            storage_livre_gb: Number($("storageLivre").value),
            storage_total_gb: Number($("storageLivre").value),
        },
    };

    try {
        const dados = await chamarApi("/comparar", { method: "POST", body: JSON.stringify(payload) });

        resultado.innerHTML =
            `<div class="veredito ${dados.nivel_geral}">${dados.nivel_geral} — score geral ${dados.score_geral}/100</div>` +
            dados.componentes.map(linhaComponente).join("");
        resultado.classList.add("ativo");

        msg.className = "msg ok";
        msg.textContent = "Comparação concluída pelo robô oficial.";
    } catch (erro) {
        msg.className = "msg erro";
        msg.textContent = erro.message;
    } finally {
        btn.disabled = false;
        btn.textContent = "Verificar compatibilidade";
    }
});

// Preseleciona o app pela URL (?app=Nome), usado pelo link
// "Verificação avançada" vindo do site PHP (telaJogo.php)
const params = new URLSearchParams(window.location.search);
const appPreSelecionado = params.get("app");

verificarStatus();
carregarApps();
carregarTabela("apps");
</script>
</body>
</html>
